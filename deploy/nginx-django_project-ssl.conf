# HTTP — редирект на HTTPS и ACME challenge для Let's Encrypt
server {
    listen 80;
    server_name 134.17.17.168 nextanalytics.ru www.nextanalytics.ru;
    root /home/user/nextan;

    # Let's Encrypt ACME challenge (для выдачи и продления сертификата)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /home/user/nextan;
        allow all;
    }

    # Редирект всего остального HTTP-трафика на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной виртуальный хост
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 134.17.17.168 nextanalytics.ru www.nextanalytics.ru;

    # SSL-сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/nextanalytics.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextanalytics.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/user/nextan;

    # Фавикон
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /static/favicon.ico =404;
    }

    # Статические файлы Django
    location /static/ {
        alias /home/user/nextan/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        autoindex off;
    }

    # Динамический контент — Django через Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 75s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(\.git|\.env|\.py|\.pyc|\.sqlite3|/venv/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
